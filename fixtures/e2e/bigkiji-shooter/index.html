<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111715">
  <title>BigKiji · Garden Patrol</title>
  <link rel="stylesheet" href="./app.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <main id="game" aria-label="BigKiji Garden Patrol game">
    <canvas id="canvas" aria-label="3D garden play field"></canvas>

    <header class="hud" aria-label="Game status">
      <div class="brand"><small>GARDEN PATROL</small><strong>BigKiji</strong></div>
      <dl aria-live="polite" aria-atomic="true">
        <div><dt>Score</dt><dd id="score">0</dd></div>
        <div><dt>Health</dt><dd id="health">100</dd></div>
      </dl>
    </header>

    <section class="intro" id="intro" aria-labelledby="intro-title">
      <div class="kicker">A quiet-garden field note</div>
      <h1 id="intro-title">Keep the garden clear.</h1>
      <p>Guide BigKiji through the grass and scatter every shadow before they close in.</p>
      <div class="controls" aria-label="Keyboard and mouse controls">
        <span><kbd>WASD</kbd><em>Move</em></span>
        <span><kbd>↑ ↓ ← →</kbd><em>Move</em></span>
        <span><kbd>Click</kbd> or <kbd>Space</kbd><em>Aim &amp; fire</em></span>
      </div>
      <button id="start" type="button">Start patrol <span aria-hidden="true">→</span></button>
    </section>

    <section class="touch" aria-label="Touch controls">
      <div class="pad" id="pad" role="button" aria-label="Move BigKiji"><i aria-hidden="true"></i></div>
      <button id="fire" type="button" aria-label="Fire"><span aria-hidden="true"></span></button>
    </section>

    <button id="restart" type="button" hidden>
      <small>Garden overrun</small>
      <strong>Patrol again</strong>
      <span aria-hidden="true">↻</span>
    </button>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
