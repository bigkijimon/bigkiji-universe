<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05080f" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>BigKiji Universe Mobile</title>
<style>
  :root {
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --em: #34d399; --cy: #00f3ff; --yl: #FFE81F; --pk: #f472b6;
    --ink: rgba(233,246,240,.94); --dim: rgba(226,240,234,.6); --faint: rgba(226,240,234,.34);
    --hairline: rgba(255,255,255,.09);
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #05080f; color: var(--ink);
    font-family: -apple-system, "SF Pro", sans-serif; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ── header ── */
  header { flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sat) + 8px) 12px 6px; z-index: 30; }
  header .mark { color: var(--em); font-size: 15px; text-shadow: 0 0 10px rgba(52,211,153,.8); }
  header h1 { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; }
  header .sub { color: var(--faint); font-size: 9.5px; font-family: "SF Mono", Menlo, monospace; }
  #conn { margin-left: auto; display: flex; align-items: center; gap: 5px;
    font: 700 9px "SF Mono", Menlo, monospace; letter-spacing: .08em; color: var(--faint); }
  #conn i { width: 7px; height: 7px; border-radius: 50%; background: #fb7185;
    transition: background .2s var(--ease); }
  #conn.on i { background: var(--em); animation: breathe 3s ease-in-out infinite; }
  #conn.on { color: var(--em); }
  #install { display:none; border:1px solid rgba(230,190,96,.26); border-radius:999px; padding:4px 8px; color:#d9c58f; background:rgba(230,190,96,.06); font:700 8px "SF Mono",Menlo,monospace; }
  #install.on { display:block; }
  @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }

  /* ── LIVE COMMENTARY BAR ── */
  #comm { flex: none; margin: 0 10px 4px; padding: 5px 10px; z-index: 30;
    background: rgba(8,14,22,.72); border: 1px solid rgba(0,243,255,.22); border-radius: 9px;
    font: 600 10.5px "SF Mono", Menlo, monospace; color: var(--cy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: .55; transition: opacity .2s var(--ease); }
  #comm.on { opacity: 1; text-shadow: 0 0 12px rgba(0,243,255,.4); }

  /* ── synapse canvas ── */
  #cvWrap { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; touch-action: none; }
  #selChip { position: absolute; left: 50%; bottom: 12px; z-index: 5;
    transform: translateX(-50%) translateY(6px) scale(.96); opacity: 0; pointer-events: none;
    font: 700 10.5px "SF Mono", Menlo, monospace; letter-spacing: .08em; color: var(--c, var(--em));
    background: rgba(8,14,22,.8); border: 1px solid var(--c, var(--em)); border-radius: 999px;
    padding: 4px 12px; transition: opacity .2s var(--ease), transform .2s var(--ease); }
  #selChip.on { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  #vstate { position: absolute; top: 10px; right: 12px; z-index: 5; display: none;
    font: 700 9.5px "SF Mono", Menlo, monospace; letter-spacing: .1em;
    padding: 4px 11px; border-radius: 999px; color: var(--lc, var(--cy));
    border: 1px solid var(--lc, var(--cy)); background: rgba(5,10,16,.7);
    animation: breathe 1.4s ease-in-out infinite; }
  #vstate.on { display: block; }

  /* ── reply stream ── */
  #reply { flex: none; margin: 0 10px 6px; max-height: 24vh; overflow-y: auto; display: none;
    background: rgba(8,14,22,.78); border: 1px solid rgba(255,232,31,.2); border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.6; color: var(--dim);
    white-space: pre-wrap; word-break: break-word; -webkit-overflow-scrolling: touch; }
  #reply.on { display: block; }
  #reply .you { color: var(--cy); }

  /* ── composer ── */
  #composer { flex: none; display: flex; gap: 7px; align-items: center;
    padding: 6px 10px calc(var(--sab) + 84px); z-index: 20; }
  #txt { flex: 1; min-width: 0; background: rgba(8,14,22,.85); border: 1px solid rgba(52,211,153,.28);
    border-radius: 11px; padding: 11px 13px; color: var(--ink); outline: none;
    font: 13px "SF Mono", Menlo, monospace; caret-color: var(--em);
    transition: border-color .15s var(--ease); }
  #txt:focus { border-color: rgba(52,211,153,.6); }
  #txt::placeholder { color: var(--faint); }
  .cbtn { flex: none; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--hairline); background: rgba(255,255,255,.05); border-radius: 11px;
    color: var(--dim); font-size: 16px; transition: transform .12s var(--ease); }
  .cbtn:active { transform: scale(0.94); }
  #send { color: var(--em); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
  @keyframes livePulse { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
  #mic.listen, #mic.capture, #mic.think, #mic.speak {
    color: var(--lc); border-color: var(--lc); background: rgba(0,0,0,.35);
    animation: livePulse var(--lp, 1.8s) ease-in-out infinite; }
  #mic.listen { --lc: #00f3ff; --lp: 1.8s; }
  #mic.capture { --lc: #00ff9d; --lp: .8s; }
  #mic.think { --lc: #FFE81F; --lp: 1.1s; }
  #mic.speak { --lc: #f472b6; --lp: .7s; }

  /* ── Owner approval sheet ── */
  #approval { position: fixed; inset: auto 9px calc(var(--sab) + 10px); z-index: 70; display: none;
    border: 1px solid rgba(230,190,96,.35); border-radius: 16px; padding: 14px;
    background: linear-gradient(145deg, rgba(18,25,22,.97), rgba(8,13,12,.98));
    box-shadow: 0 24px 70px rgba(0,0,0,.72), 0 0 32px rgba(230,190,96,.08); }
  #approval.on { display: block; animation: approvalIn .24s var(--ease); }
  @keyframes approvalIn { from { opacity:0; transform:translateY(18px) scale(.985); } }
  .approval-head { display:flex; align-items:flex-start; gap:9px; }
  .approval-head i { flex:none; width:8px; height:8px; margin-top:5px; border-radius:50%; background:#e6be60; box-shadow:0 0 12px rgba(230,190,96,.65); }
  .approval-head div { min-width:0; flex:1; }.approval-head b { display:block; color:#f0e7cf; font-size:13px; }.approval-head span { display:block; margin-top:2px; color:#887f6b; font:8px "SF Mono",Menlo,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #approvalClose { border:0; background:none; color:#768078; font-size:20px; }
  #approvalGoal { margin:12px 0 9px; max-height:76px; overflow:auto; color:#dce7e1; font-size:12px; line-height:1.55; }
  #approvalAssignments { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px; }
  #approvalAssignments span { border:1px solid rgba(148,170,159,.16); border-radius:999px; padding:4px 7px; color:#92a39a; background:rgba(255,255,255,.025); font:8px "SF Mono",Menlo,monospace; }
  .plan-seal { display:grid; grid-template-columns:1fr auto; gap:8px; padding:8px 9px; border-radius:8px; background:rgba(230,190,96,.055); color:#8f8875; font:8px "SF Mono",Menlo,monospace; }.plan-seal b{color:#d9c58f;font-weight:600}
  .approval-actions { display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:7px; margin-top:11px; }
  .approval-actions button { min-height:42px; border:1px solid rgba(159,179,168,.18); border-radius:10px; color:#cad7d0; background:rgba(255,255,255,.045); font:700 10px -apple-system,sans-serif; }
  #approvalAccept { position:relative; overflow:hidden; color:#17231d; border-color:#9bc9b1; background:#9bc9b1; }
  #approvalAccept::after { content:""; position:absolute; inset:0; width:var(--hold,0%); background:rgba(255,255,255,.38); pointer-events:none; }
  #approvalReject { color:#e8aaa2; border-color:rgba(225,128,106,.3); }.approval-actions button:disabled{opacity:.38}
  #approvalStop { display:none; width:100%; min-height:42px; margin-top:11px; border:1px solid rgba(225,128,106,.34); border-radius:10px; color:#f0b1a8; background:rgba(225,128,106,.08); font:700 10px -apple-system,sans-serif; }
  #approval.running { border-color:rgba(52,211,153,.3); }.running .approval-head i{background:#34d399;box-shadow:0 0 12px rgba(52,211,153,.55)}
  .running .approval-actions,.running #directiveEditor{display:none}.running #approvalStop{display:block}
  #directiveEditor { display:none; margin-top:9px; }.editing #directiveEditor{display:grid;grid-template-columns:1fr auto;gap:7px}
  #directiveText { min-height:70px; resize:none; border:1px solid rgba(134,169,149,.28); border-radius:10px; padding:10px; color:#e0ece5; background:rgba(2,7,6,.75); font:11px/1.5 -apple-system,sans-serif; outline:none; }
  #directiveSend { border:1px solid rgba(134,169,149,.35); border-radius:10px; padding:0 12px; color:#dce9e2; background:rgba(134,169,149,.12); }
  #approvalError { display:none; margin-top:8px; color:#f2a49a; font:9px/1.4 "SF Mono",Menlo,monospace; }.approval-error #approvalError{display:block}

  /* ── BottomSheet metrics ── */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; height: 332px;
    transform: translateY(calc(100% - 74px - var(--sab)));
    background: linear-gradient(180deg, rgba(8,16,28,.96), rgba(4,9,18,.98));
    border-top: 1px solid rgba(52,211,153,.3); border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 40px -12px rgba(0,243,255,.25);
    transition: transform .26s var(--ease); padding-bottom: var(--sab); }
  #sheet.open { transform: translateY(0); }
  #sheet.drag { transition: none; }
  #grab { padding: 8px 14px 4px; touch-action: none; }
  #grab .bar { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); margin: 0 auto 8px; }
  #stageLine { font: 600 10px "SF Mono", Menlo, monospace; letter-spacing: .05em; color: var(--cy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stageLine.busy { animation: breathe 1.2s ease-in-out infinite; }
  #stageTrack { height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 5px; overflow: hidden; }
  #stageBar { display: block; height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, var(--cy), #00ff9d);
    box-shadow: 0 0 8px rgba(0,243,255,.6); transition: width .5s var(--ease); }
  #meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding: 10px 14px 6px; }
  .meter { border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-radius: 9px;
    background: color-mix(in srgb, var(--c) 6%, transparent); padding: 6px 9px; min-width: 0; }
  .meter label { display: block; font: 700 8px "SF Mono", Menlo, monospace; letter-spacing: .08em;
    color: color-mix(in srgb, var(--c) 80%, white 10%);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter b { display: block; font: 700 16px "SF Mono", Menlo, monospace; color: var(--ink);
    font-variant-numeric: tabular-nums; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter span { font: 600 8.5px "SF Mono", Menlo, monospace; color: var(--faint); }
  .meter i { display: block; height: 3px; border-radius: 2px; margin-top: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
  .meter i u { display: block; height: 100%; width: 0%; background: var(--c); border-radius: 2px;
    transition: width .5s var(--ease); }
  #feedM { padding: 2px 14px 10px; overflow: hidden; }
  #feedM .fl { font: 10px "SF Mono", Menlo, monospace; color: var(--faint); line-height: 1.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feedM .fl b { color: var(--dim); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="mark">❖</span><h1>BigKiji Universe</h1><span class="sub">MOBILE · DEVICE GPU</span>
    <button id="install">INSTALL</button><span id="conn"><i></i><span id="connT">CONNECTING</span></span>
  </header>
  <div id="comm">[LIVE] Linking to the BigKiji nerve center…</div>
  <div id="cvWrap">
    <canvas id="cv"></canvas>
    <span id="selChip"></span>
    <span id="vstate">LISTENING</span>
  </div>
  <div id="reply"></div>
  <div id="composer">
    <input id="txt" type="text" autocomplete="off" spellcheck="false"
      placeholder="Command the universe…  ⏎ to send" enterkeyhint="send" />
    <button id="mic" class="cbtn" title="Live voice">🎙</button>
    <button id="send" class="cbtn" title="Send">▲</button>
  </div>
  <section id="approval" aria-live="assertive" aria-label="Owner approval required">
    <div class="approval-head"><i></i><div><b id="approvalTitle">Owner approval required</b><span id="approvalMeta"></span></div><button id="approvalClose" aria-label="Hide approval sheet">×</button></div>
    <div id="approvalGoal"></div><div id="approvalAssignments"></div>
    <div class="plan-seal"><span>CURRENT PLAN SEAL</span><b id="approvalHash"></b></div>
    <div class="approval-actions"><button id="approvalAccept">Hold to accept</button><button id="approvalEdit">Edit</button><button id="approvalReject">Reject</button></div>
    <button id="approvalStop">Stop run</button>
    <div id="directiveEditor"><textarea id="directiveText" placeholder="Describe what BigKiji should change before execution…"></textarea><button id="directiveSend">Re-plan</button></div>
    <div id="approvalError"></div>
  </section>
  <div id="sheet">
    <div id="grab"><div class="bar"></div>
      <div id="stageLine">&gt; STANDBY — AWAITING DIRECTIVE</div>
      <div id="stageTrack"><span id="stageBar"></span></div>
    </div>
    <div id="meters">
      <div class="meter" style="--c:#00f3ff"><label>SYNAPSE FLUX</label><b id="mFlux">0</b><span>ev/min</span><i><u id="bFlux"></u></i></div>
      <div class="meter" style="--c:#FFE81F"><label>TOKEN VELOCITY</label><b id="mTok">—</b><span>tok/s</span><i><u id="bTok"></u></i></div>
      <div class="meter" style="--c:#a78bfa"><label>TRAVERSAL LAT</label><b id="mLat">—</b><span>ms/tool</span><i><u id="bLat"></u></i></div>
      <div class="meter" style="--c:#00ff9d"><label>GRAPH LINKS</label><b id="mGraph">0</b><span>nodes</span><i><u id="bGraph"></u></i></div>
      <div class="meter" style="--c:#4e8cff"><label>MODEL TIER</label><b id="mTier">—</b><span id="mTierSub"></span><i><u id="bTier"></u></i></div>
      <div class="meter" style="--c:#34d399"><label>LINK RTT</label><b id="mRtt">—</b><span>ms</span><i><u id="bRtt"></u></i></div>
    </div>
    <div id="feedM"></div>
  </div>
</div>

<script type="module">
import * as THREE from '/vendor/three.module.js';

/* ── auth token: 初回 /?t=xxx で入場 → localStorage保存（cookieも同時に付く） ── */
const qs = new URLSearchParams(location.search);
if (qs.get('t')) { localStorage.setItem('bk_t', qs.get('t')); }
const TOKEN = localStorage.getItem('bk_t') || '';
let CSRF = localStorage.getItem('bk_csrf') || '';
const api = (p) => p + (TOKEN ? (p.includes('?') ? '&' : '?') + 't=' + TOKEN : '');
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

const $ = (id) => document.getElementById(id);
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => { event.preventDefault(); installPrompt = event; $('install').classList.add('on'); });
$('install').onclick = async () => {
  if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('install').classList.remove('on'); return; }
  comm(/iPhone|iPad/i.test(navigator.userAgent) ? '[INSTALL] Share → Add to Home Screen' : '[INSTALL] Use your browser menu → Install app');
};
if (!matchMedia('(display-mode: standalone)').matches && /iPhone|iPad/i.test(navigator.userAgent)) $('install').classList.add('on');
const AGENTS = {
  'claude-code': ['Claude', '#d97757'], codex: ['Codex', '#00a67d'],
  'pi-agent': ['PiAgent', '#d946ef'], qwen: ['Local Qwen', '#38bdf8'],
};

/* ── LIVE COMMENTARY BAR ── */
let commT = null;
function comm(text) {
  const el = $('comm');
  el.textContent = text.slice(0, 130);
  el.classList.add('on');
  clearTimeout(commT);
  commT = setTimeout(() => el.classList.remove('on'), 5200);
}

/* ── STAGE ── */
let stageT = null;
function setStage(text, { busy = false, pct = null, hold = 0 } = {}) {
  const l = $('stageLine');
  l.textContent = '> ' + text;
  l.classList.toggle('busy', busy);
  if (pct != null) $('stageBar').style.width = pct + '%';
  clearTimeout(stageT);
  if (hold) stageT = setTimeout(() => { l.textContent = '> STANDBY — AWAITING DIRECTIVE'; l.classList.remove('busy'); $('stageBar').style.width = '0%'; }, hold);
}

/* ── metrics（全て実測） ── */
const evTimes = [];
const latHist = [];
let lastTokRate = 0, vaultCount = 0, curModel = '', sseRtt = 0, pendingInventory = null;
let currentRun = null;
const setM = (v, b, val, max) => { $(v).textContent = val; $(b).style.width = Math.min(100, (parseFloat(val) || 0) / max * 100) + '%'; };
setInterval(() => {
  const now = performance.now();
  while (evTimes.length && now - evTimes[0] > 60000) evTimes.shift();
  setM('mFlux', 'bFlux', String(evTimes.length), 60);
  setM('mTok', 'bTok', lastTokRate ? lastTokRate.toFixed(1) : '—', 300);
  const lat = latHist.length ? Math.round(latHist.reduce((a, b) => a + b, 0) / latHist.length) : 0;
  $('mLat').textContent = lat || '—';
  $('bLat').style.width = lat ? Math.max(6, 100 - lat / 40) + '%' : '0%';
  setM('mGraph', 'bGraph', String(vaultCount), 4000);
  const tier = curModel.includes('preview') ? 'T1' : curModel.includes('lite') ? 'T2' : curModel.includes('qwen') ? 'T3' : '—';
  $('mTier').textContent = tier;
  $('mTierSub').textContent = tier === 'T3' ? 'LOCAL ¥0' : curModel.split('/').pop().slice(0, 14);
  $('bTier').style.width = tier === 'T1' ? '100%' : tier === 'T2' ? '66%' : tier === 'T3' ? '33%' : '0%';
  setM('mRtt', 'bRtt', sseRtt ? String(sseRtt) : '—', 400);
}, 1000);

/* ── mini feed（sheet内・直近4行） ── */
const feedLines = [];
function feedM(html) {
  feedLines.unshift(html);
  while (feedLines.length > 4) feedLines.pop();
  $('feedM').innerHTML = feedLines.map((h) => `<div class="fl">${h}</div>`).join('');
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── reply stream + mobile sentence-TTS ── */
let replyBuf = '';
function replyShow(html, cls) {
  const r = $('reply');
  r.classList.add('on');
  if (cls === 'you') r.innerHTML += `\n<span class="you">${html}</span>\n`;
  else r.innerHTML += html;
  r.scrollTop = r.scrollHeight;
  if (r.textContent.length > 4000) r.innerHTML = esc(r.textContent.slice(-3000));
}
const synthQ = [];
function speakNext() {
  if (!('speechSynthesis' in window)) return;
  if (speechSynthesis.speaking || !synthQ.length) return;
  const s = synthQ.shift();
  const u = new SpeechSynthesisUtterance(s);
  u.lang = /[぀-ヿ一-鿿]/.test(s) ? 'ja-JP' : 'en-US';
  u.rate = 1.05;
  u.onend = () => { if (!synthQ.length && !speechSynthesis.pending) setVState(voice.live ? 'LISTEN' : null); speakNext(); };
  setVState('SPEAK');
  speechSynthesis.speak(u);
}
function ownerSpeech(text) {
  return String(text || '')
    .replace(/<(?:thought|thinking|analysis)\b[^>]*>[\s\S]*?<\/(?:thought|thinking|analysis)>/gi, '')
    .replace(/^\s*(?:thinking|thought|analysis|internal reasoning)\s*:\s*.*$/gim, '')
    .trim();
}
function ttsFinal() {
  if (!voice.live) return;
  const finalText = ownerSpeech(replyBuf);
  if (finalText) synthQ.push(finalText);
  speakNext();
}
function ttsCut() { synthQ.length = 0; try { speechSynthesis.cancel(); } catch (_) {} }

/* ── SSE sync engine（EventSource自動再接続＋visibility復帰） ── */
let es = null, esTimer = null, lastPing = 0;
function applyState(s) {
  vaultCount = s.inventory?.files?.length ?? s.vaultCount ?? 0;
  curModel = s.model || '';
  if (s.inventory) { pendingInventory = s.inventory; window.__applyMobileInventory?.(s.inventory); }
  const active = (s.runs || []).filter((run) => !['COMPLETED', 'FAILED'].includes(run.status)).at(-1);
  if (active) applyRun(active);
}
function applyRun(run) {
  if (!run?.id) return; currentRun = run;
  const pending = run.status === 'AWAITING_APPROVAL';
  const running = ['EXECUTING', 'REPAIRING', 'VERIFYING'].includes(run.status); const panel = $('approval');
  panel.classList.toggle('on', pending || running); panel.classList.toggle('running', running); panel.classList.remove('approval-error', 'editing');
  if (!pending && !running) return;
  $('approvalTitle').textContent = running ? 'BigKiji run in progress' : run.repairCycle ? `Repair ${run.repairCycle} needs approval` : 'Owner approval required';

const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  if (document.visibilityState !== 'visible') return;
  const dt = Math.min(clock.getDelta(), 0.05);
  G.rotation.y += dt * 0.05;
  for (const id of ids) {
    const n = nodes[id];
    n.act = Math.max(0, n.act - dt * 0.6);
    n.lineMat.opacity = (0.14 + n.act * 0.55) * mobileCoreReveal;
    n.sprite.material.opacity = 0.75 + n.act * 0.25;
    n.sprite.scale.setScalar(1.7 + n.act * 0.5);
    if (n.act > 0 && n.t < 1) { // 神経伝達パルス走行
      n.t = Math.min(1, n.t + dt * (1.2 + n.act));
      n.curve.getPoint(n.t, n.dot.position);
      n.dot.material.opacity = n.act;
    } else n.dot.material.opacity = 0;
  }
  nodes.core.act = Math.max(0, nodes.core.act - dt * 0.5);
  if (mobileCoreWakeAt) {
    const progress = Math.min(1, (performance.now() - mobileCoreWakeAt) / 1300);
    mobileCoreReveal = THREE.MathUtils.smoothstep(progress, 0.02, 0.78);
    if (progress >= 1) mobileCoreWakeAt = 0;
  }
  coreSprite.scale.setScalar((3.4 + nodes.core.act * 0.7 + Math.sin(clock.elapsedTime * 1.4) * 0.08) * Math.max(0.025, mobileCoreReveal));
  coreSprite.material.opacity = mobileCoreReveal;
  ambFlash = Math.max(0, ambFlash - dt * 1.4);
  updateMobileInventory(clock.elapsedTime);
  if (focusT) { // ダブルタップフォーカス: カメラをノード寄りへ滑走（ease-out的lerp）
    const target = focusT.clone().normalize().multiplyScalar(focusT.length() + 3.4).add(new THREE.Vector3(0, 1.2, 0));
    camera.position.lerp(target, 1 - Math.exp(-dt * 4));
    if (camera.position.distanceTo(target) < 0.05) focusT = null;
  }
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
})();

/* ══ Live Voice（iPhone側VAD＋Barge-in＝speechSynthesis.cancel） ══ */
const voice = { live: false, ctx: null, stream: null, node: null, speech: false, floor: 0.008,
  speechStart: 0, silenceStart: 0, utterStart: 0, utterFrom: 0, w: 0 };
const SR = 16000;
const ring = new Float32Array(SR * 30);
function setVState(p) {
  const el = $('vstate'), mic = $('mic');
  mic.classList.remove('listen', 'capture', 'think', 'speak');
  if (!p || !voice.live) { el.classList.remove('on'); return; }
  el.classList.add('on');
  el.textContent = { LISTEN: 'LISTENING', CAPTURE: 'HEARING YOU', THINK: 'THINKING…', SPEAK: 'SPEAKING — INTERRUPT ANYTIME' }[p] || p;
  el.style.setProperty('--lc', { LISTEN: '#00f3ff', CAPTURE: '#00ff9d', THINK: '#FFE81F', SPEAK: '#f472b6' }[p]);
  mic.classList.add({ LISTEN: 'listen', CAPTURE: 'capture', THINK: 'think', SPEAK: 'speak' }[p]);
}
const WORKLET = URL.createObjectURL(new Blob([`
class P extends AudioWorkletProcessor {
  constructor(){ super(); this.frac = 0; this.prev = null; }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (!ch || !ch.length) return true;
    const r = sampleRate / 16000; // 48k/44.1kどちらでも線形補間で16kへ
    let data;
    if (this.prev === null) data = ch;
    else { data = new Float32Array(ch.length + 1); data[0] = this.prev; data.set(ch, 1); }
    const n = data.length;
    const out = []; let sum = 0; let p = this.frac;
    while (p <= n - 1 - 1e-9) {
      const i = Math.floor(p), f = p - i;
      const v = data[i] + (data[i + 1] - data[i]) * f;
      out.push(v); sum += v * v; p += r;
    }
    this.frac = p - (n - 1); this.prev = data[n - 1];
    if (out.length) {
      const o = new Float32Array(out);
      this.port.postMessage({ pcm: o, rms: Math.sqrt(sum / o.length) }, [o.buffer]);
    }
    return true;
  }
}
registerProcessor('bkm', P);`], { type: 'text/javascript' }));

function wavEncode(f32) {
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, f32[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return buf;
}
function onFrame({ pcm, rms }) {
  if (!voice.live) return;
  for (let i = 0; i < pcm.length; i++) { ring[voice.w] = pcm[i]; voice.w = (voice.w + 1) % ring.length; }
  const now = performance.now();
  if (!voice.speech) voice.floor = voice.floor * 0.98 + rms * 0.02;
  const speaking = speechSynthesis.speaking || synthQ.length > 0;
  const thresh = Math.max(voice.floor * (speaking ? 4 : 3), 0.010);
  if (!voice.speech) {
    if (rms > thresh) {
      if (!voice.speechStart) voice.speechStart = now;
      if (now - voice.speechStart >= (speaking ? 250 : 90)) {
        voice.speech = true; voice.utterStart = now;
        const back = Math.round(((now - voice.speechStart) + 300) / 1000 * SR);
        voice.utterFrom = (voice.w - Math.min(back, ring.length - 1) + ring.length) % ring.length;
        if (speaking) ttsCut(); // ★Barge-in: AIの声を即カットして聞く体制へ
        setVState('CAPTURE');
      }
    } else voice.speechStart = 0;
  } else {
    if (rms < Math.max(voice.floor * 1.8, 0.006)) {
      if (!voice.silenceStart) voice.silenceStart = now;
      if (now - voice.silenceStart >= 700) { endUtter(now); return; }
    } else voice.silenceStart = 0;
    if (now - voice.utterStart > 20000) endUtter(now);
  }
}
async function endUtter(now) {
  voice.speech = false; voice.silenceStart = 0; voice.speechStart = 0;
  if (now - voice.utterStart < 300) { setVState('LISTEN'); return; }
  const len = (voice.w - voice.utterFrom + ring.length) % ring.length;
  const pcm = new Float32Array(len);
  for (let i = 0; i < len; i++) pcm[i] = ring[(voice.utterFrom + i) % ring.length];
  setVState('THINK');
  try {
    const r = await fetch(api('/api/voice'), { method: 'POST', body: wavEncode(pcm) });
    const j = await r.json();
    if (j.text) { replyShow(esc('🎙 ' + j.text), 'you'); replyBuf = ''; }
    else setVState('LISTEN');
  } catch (_) { setVState('LISTEN'); comm('[LIVE] ⚠️ Voice upload failed'); }
}
$('mic').addEventListener('click', async () => {
  if (voice.live) { // ライブ終了
    voice.live = false;
    ttsCut();
    try { voice.node && voice.node.disconnect(); } catch (_) {}
    try { voice.stream && voice.stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
    try { voice.ctx && voice.ctx.close(); } catch (_) {}
    voice.ctx = voice.stream = voice.node = null;
    setVState(null);
    comm('[LIVE] 🎙 Live voice session ended');
    return;
  }
  try {
    voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    voice.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await voice.ctx.resume().catch(() => {});
    await voice.ctx.audioWorklet.addModule(WORKLET);
    const src = voice.ctx.createMediaStreamSource(voice.stream);
    voice.node = new AudioWorkletNode(voice.ctx, 'bkm');
    const mute = voice.ctx.createGain(); mute.gain.value = 0;
    src.connect(voice.node).connect(mute).connect(voice.ctx.destination);
    voice.node.port.onmessage = (e) => onFrame(e.data);
    voice.live = true; voice.speech = false;
    if ('speechSynthesis' in window) speechSynthesis.getVoices(); // iOSのvoiceロード誘発
    setVState('LISTEN');
    comm('[LIVE] 🎙 Live voice — hands-free. Speak anytime; interrupt me freely.');
  } catch (err) {
    comm('[LIVE] ⚠️ Mic unavailable: ' + (err.message || err.name));
  }
});
</script>
