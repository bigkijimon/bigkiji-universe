<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>BigKiji Console</title>
<link rel="stylesheet" href="../../../node_modules/@xterm/xterm/css/xterm.css" />
<link rel="stylesheet" href="./settings-modal.css" />
<!--
  The working surface.

  The Synapse Canvas is the story BigKiji tells about itself; this is the window you
  actually get work done in, so it is quiet on purpose: a light, opaque, high-density
  workspace with one thing on screen at a time. The 3D scene is one button away and
  never underneath the text.

  House rules that constrain everything below:
  - No backdrop-filter anywhere. This window is opaque and sets no vibrancy, and mixing
    the two breaks the material outright (electron#39529, measured in glass-lab).
  - Motion is transform/opacity only, ease-out, under 300ms, and honours both
    prefers-reduced-motion and appearance.reduceMotion.
  - Every control here is bound to a setting that exists. Nothing is displayed that the
    app cannot actually change.
-->
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --card: #ececf0;
    --card-strong: #e2e2e8;
    --line: #dcdce3;
    --line-soft: #e8e8ee;
    --ink: #1d1d20;
    --ink-soft: #6b6b73;
    --ink-faint: #96969f;
    /* BigKiji's own identity, from src/domain/terminal/cli-theme.js — the CLI and this
       window are the same product and should not disagree about what colour it is. */
    --accent: #c2600f;
    --accent-bright: #f28c28;
    --accent-wash: #fdf1e3;
    --brown: #6b4226;
    --ok: #1a7f4b;
    --danger: #b83a18;
    --radius: 12px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --fast: 140ms;
    --base: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #202024; --card: #26262b; --card-strong: #2e2e34;
      --line: #35353d; --line-soft: #2b2b32; --ink: #f2f2f5; --ink-soft: #a4a4ae;
      --ink-faint: #74747e; --accent: #f28c28; --accent-wash: #33240f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Scrollbars are removed everywhere and replaced by ordinary wheel/trackpad scroll.
     Chrome keeps the scroll behaviour; only the painted bar goes. */
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:active { transform: scale(.97); }
  button, .tab, .chip { transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease), transform var(--fast) var(--ease), border-color var(--fast) var(--ease); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- title bar ---------- */
  .titlebar {
    -webkit-app-region: drag; user-select: none;
    height: 46px; flex: 0 0 46px; padding: 0 14px 0 84px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-bottom: 1px solid var(--line-soft);
  }
  .titlebar .title { font-weight: 590; font-size: 13px; letter-spacing: -.01em; }
  .titlebar .sub { color: var(--ink-faint); font-size: 11.5px; }
  .titlebar .spacer { flex: 1; }
  .titlebar .actions { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 8px; }
  .iconbtn {
    width: 30px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); font-size: 13px;
  }
  .iconbtn:hover { background: var(--card); color: var(--ink); }
  .iconbtn.accent { color: var(--accent); }
  .iconbtn.go { color: var(--ok); }

  /* ---------- session tabs ---------- */
  .tabstrip {
    flex: 0 0 auto; display: flex; align-items: stretch; gap: 2px;
    padding: 0 10px; background: var(--bg); border-bottom: 1px solid var(--line);
    overflow-x: auto; white-space: nowrap;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 12px 8px; border-bottom: 2px solid transparent;
    color: var(--ink-soft); font-size: 12.5px; max-width: 230px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 550; }
  .tab .dot {
    width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px;
    display: grid; place-items: center; font-size: 9px; font-weight: 700;
    background: var(--accent-wash); color: var(--accent); border: 1px solid #0000000f;
  }
  .tab .label { overflow: hidden; text-overflow: ellipsis; }
  .tab .spin { width: 11px; height: 11px; flex: 0 0 11px; border-radius: 50%;
    border: 1.5px solid var(--line); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tabstrip .grow { flex: 1; }
  .tabstrip .edge { display: inline-flex; align-items: center; padding: 0 6px; color: var(--ink-faint); }

  /* ---------- body ---------- */
  .body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: flex; flex-direction: column; }

  /* ---------- approval gate ----------
     Every mutation-capable run stops here. It is the loudest thing in the window on
     purpose: this is the moment the owner is deciding to spend money and let something
     write to disk, and the plan hash is what they are agreeing to. */
  .approval {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    background: var(--accent-wash); border-bottom: 1px solid var(--accent);
  }
  .approval-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .approval-text b { font-size: 12.5px; }
  .approval-text span { font-size: 11px; color: var(--ink-soft); font-family: "SF Mono", Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .approval .primary { background: var(--accent); color: #fff; padding: 6px 15px; border-radius: 8px; font-size: 12.5px; font-weight: 550; }
  .approval .ghost { padding: 6px 12px; border-radius: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .approval .ghost:hover { background: #0000000d; color: var(--ink); }

  /* ---------- panes ----------
     One conversation, plus one pane per specialist the coordinator actually assigned.
     The panes are not decoration: each is a separate provider process with its own
     model and its own live output. */
  /* The conversation keeps its width. Three specialists at a fixed width used to add up
     to more than the window and squeezed the chat pane — and its composer — down to
     nothing, so the owner could watch the work but no longer talk to it. Specialists
     scroll sideways instead. */
  .panes { flex: 1; min-height: 0; display: flex; align-items: stretch; overflow-x: auto; }
  .pane { display: flex; flex-direction: column; position: relative; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane-chat { flex: 1 0 400px; min-width: 400px; position: sticky; left: 0; z-index: 1; background: var(--bg); container-type: inline-size; }
  /* With specialists running the conversation gets narrow. Drop the least important
     control first rather than letting the composer crush the send button. */
  @container (max-width: 520px) { .metarow .sel.optional { display: none; } }
  .pane-agent { flex: 0 0 320px; min-width: 320px; background: var(--surface); }
  .pane-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft); font-size: 11.5px;
  }
  .pane-head .role { font-weight: 600; color: var(--ink); }
  .pane-head .who { color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .grow { flex: 1; }
  .pane-head .state { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--card); color: var(--ink-soft); }
  .pane-head .state[data-state="running"] { background: var(--accent-wash); color: var(--accent); }
  .pane-head .state[data-state="completed"] { color: var(--ok); }
  .pane-head .state[data-state="failed"], .pane-head .state[data-state="blocked"] { color: var(--danger); }
  .pane-log {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px;
    font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; color: var(--ink-soft);
  }
  .pane-log .err { color: var(--danger); }
  .pane-log .idle { color: var(--ink-faint); font-family: inherit; }

  /* ---------- transcript ---------- */
  #scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .thread { max-width: 780px; margin: 0 auto; padding: 26px 26px 10px; }

  .empty { display: grid; place-items: center; height: 100%; text-align: center; }
  .empty .mark { width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 11px;
    background: var(--accent-wash); color: var(--accent); display: grid; place-items: center;
    font-size: 17px; font-weight: 700; letter-spacing: -.04em; }
  .empty h1 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 5px; }
  .empty p { color: var(--ink-faint); margin: 0 0 20px; font-size: 13px; }
  .empty hr { border: 0; border-top: 1px solid var(--line); width: 150px; margin: 0 auto 20px; }
  .actions-grid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 430px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px;
    background: var(--card); border: 1px solid transparent; border-radius: 999px; font-size: 13px;
  }
  .chip:hover { background: var(--card-strong); }
  .chip .g { color: var(--ink-faint); font-size: 12px; }

  .turn { margin: 0 0 22px; }
  .turn.owner { display: flex; justify-content: flex-end; }
  .turn.owner .bubble {
    background: var(--card); border-radius: 15px; padding: 9px 15px; max-width: 78%;
    white-space: pre-wrap; word-break: break-word;
  }
  .turn .who { color: var(--ink-faint); font-size: 11.5px; margin-bottom: 5px; letter-spacing: .01em; }
  .turn .meta { color: var(--ink-faint); font-size: 11px; margin-top: 9px;
    display: flex; align-items: center; gap: 9px; }
  .turn .meta .rule { flex: 1; height: 1px; background: var(--line-soft); }
  .turn .meta .redo { color: var(--ink-faint); padding: 2px 5px; border-radius: 6px; }
  .turn .meta .redo:hover { background: var(--card); color: var(--ink); }
  .turn.degraded .who::after { content: " · fallback"; color: var(--danger); }

  .thinking { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
  .thinking .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.15s var(--ease) infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* markdown */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { letter-spacing: -.015em; line-height: 1.3; margin: 22px 0 9px; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; }
  .md p { margin: 0 0 11px; }
  .md ul, .md ol { margin: 0 0 11px; padding-left: 21px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: 18px 0; }
  .md blockquote { margin: 0 0 11px; padding: 2px 0 2px 13px; border-left: 2px solid var(--line); color: var(--ink-soft); }
  .md code { font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    background: var(--card); padding: 1.5px 5px; border-radius: 5px; }
  .md figure.code { margin: 0 0 13px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .md figure.code figcaption {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; background: var(--card); border-bottom: 1px solid var(--line);
    font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--ink-soft);
  }
  .md figure.code .copy { font-size: 11px; color: var(--ink-soft); padding: 2px 7px; border-radius: 6px; }
  .md figure.code .copy:hover { background: var(--card-strong); color: var(--ink); }
  .md figure.code pre { margin: 0; padding: 12px; overflow-x: auto; }
  .md figure.code code { background: none; padding: 0; font-size: 12px; line-height: 1.6; }
  .md table { border-collapse: collapse; margin: 0 0 13px; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; }
  .md th { background: var(--card); font-weight: 590; }

  #toBottom {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) scale(.95);
    width: 30px; height: 30px; border-radius: 50%; background: var(--surface);
    border: 1px solid var(--line); color: var(--ink-soft); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity var(--base) var(--ease), transform var(--base) var(--ease);
  }
  #toBottom.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }

  /* ---------- composer ---------- */
  .composer-wrap { flex: 0 0 auto; padding: 0 26px 16px; }
  .composer {
    max-width: 780px; margin: 0 auto; background: var(--card); border: 1px solid transparent;
    border-radius: var(--radius); transition: border-color var(--base) var(--ease), background-color var(--base) var(--ease);
  }
  .composer:focus-within { background: var(--surface); border-color: var(--line); }
  .composer textarea {
    display: block; width: 100%; border: 0; background: none; resize: none; outline: none;
    padding: 13px 15px 4px; font: inherit; color: var(--ink); max-height: 210px; min-height: 46px;
  }
  .composer textarea::placeholder { color: var(--ink-faint); }
  .metarow { display: flex; align-items: center; gap: 12px; padding: 7px 11px 9px 15px; font-size: 11.5px; color: var(--ink-soft); }
  .metarow .sel { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 7px; }
  .metarow .sel:hover { background: var(--card-strong); color: var(--ink); }
  .metarow select { font: inherit; color: inherit; background: none; border: 0; outline: none; cursor: pointer; }
  .metarow .grow { flex: 1; }
  .metarow .elapsed { font-variant-numeric: tabular-nums; }
  .ring { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 8.5px; font-variant-numeric: tabular-nums; color: var(--ink-faint);
    background: conic-gradient(var(--accent) calc(var(--pct, 0) * 1%), var(--line) 0); }
  .ring i { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--card); font-style: normal; }
  .composer:focus-within .ring i { background: var(--surface); }
  .send {
    width: 27px; height: 27px; border-radius: 50%; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-size: 13px;
  }
  .send[disabled] { background: var(--line); color: var(--ink-faint); cursor: default; }
  .send[disabled]:active { transform: none; }
  .send.stop { background: var(--danger); color: #fff; }

  /* ---------- terminal ---------- */
  #termHost { flex: 1; min-height: 0; padding: 10px 12px; background: #0b0a08; }
  #termHost .xterm { height: 100%; }

  /* ---------- status bar ---------- */
  .status {
    flex: 0 0 38px; display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: var(--bg); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-soft);
  }
  .status .grow { flex: 1; }
  .status b { font-weight: 500; color: var(--ink); }
  .status .add { color: var(--ok); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; background: var(--card); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { padding: 3.5px 11px; border-radius: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 550; box-shadow: 0 1px 2px #0000000f; }
  .status .link { padding: 3.5px 9px; border-radius: 7px; }
  .status .link:hover { background: var(--card); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important;
  }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="title" id="winTitle">BigKiji Console</span>
    <span class="sub" id="winSub"></span>
    <span class="spacer"></span>
    <div class="actions">
      <button class="iconbtn" id="btnSynapse" title="Open Synapse Canvas">◎</button>
      <button class="iconbtn accent" id="btnSettings" title="Settings (⌘,)">⚙</button>
    </div>
  </div>

  <nav class="tabstrip" id="tabs" role="tablist" aria-label="Sessions"></nav>

  <div class="body">
    <!-- conversation, plus one pane per specialist the coordinator woke up -->
    <section class="view on" id="viewChatPane" role="tabpanel" aria-label="Conversation">
      <div class="approval" id="approval" hidden>
        <div class="approval-text">
          <b id="approvalTitle">A run is waiting for approval</b>
          <span id="approvalDetail"></span>
        </div>
        <button class="ghost" id="approvalAbort">Abort</button>
        <button class="primary" id="approvalGo">Approve</button>
      </div>
      <div class="panes" id="panes">
        <div class="pane pane-chat" id="paneChat">
          <div id="scroll">
            <div class="thread" id="thread">
              <div class="empty" id="empty">
                <div>
                  <div class="mark" id="agentMark">π</div>
                  <h1 id="emptyTitle">Chat with PiAgent</h1>
                  <p>Pick an action or start typing</p>
                  <hr>
                  <div class="actions-grid" id="quickActions"></div>
                </div>
              </div>
            </div>
          </div>
          <button id="toBottom" title="Jump to latest">↓</button>
          <div class="composer-wrap">
            <div class="composer">
              <textarea id="input" rows="1" placeholder="Type a message…  (⌘L to focus)" aria-label="Message"></textarea>
              <div class="metarow">
                <span class="sel" title="Local conversation model"><b id="modelName">—</b></span>
                <span class="sel" title="Execution mode — what happens when work is planned">
                  <select id="execMode" aria-label="Execution mode">
                    <option value="plan">Plan</option>
                    <option value="auto">Auto-plan</option>
                    <option value="manual">Manual</option>
                  </select>
                </span>
                <span class="sel optional" title="Independent proposals taken before work starts">
                  <select id="lenses" aria-label="Deliberation">
                    <option value="0">No deliberation</option>
                    <option value="2">2 lenses</option>
                    <option value="3">3 lenses</option>
                  </select>
                </span>
                <span class="grow"></span>
                <span class="elapsed" id="elapsed"></span>
                <span class="ring" id="ctxRing" title="Context used in the last turn"><i id="ctxPct">—</i></span>
                <button class="send" id="send" disabled aria-label="Send">↑</button>
              </div>
            </div>
          </div>
        </div>
        <!-- specialist panes are inserted here by console.js, one per assignment -->
      </div>
    </section>

    <!-- terminal -->
    <section class="view" id="viewTermPane" role="tabpanel" aria-label="Terminal">
      <div id="termHost"></div>
    </section>
  </div>

  <footer class="status">
    <span id="workspace">—</span>
    <span class="add" id="diffStat"></span>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="View">
      <button id="segChat" aria-pressed="true">Chat</button>
      <button id="segTerm" aria-pressed="false">Terminal</button>
    </div>
    <button class="link" id="btnCanvas">Synapse ◎</button>
  </footer>

  <script src="../../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="./markdown.js"></script>
  <script src="./settings-modal.js"></script>
  <script src="./console.js"></script>
  <script>
    // The same settings surface as the Synapse Canvas, mounted on this window's gear.
    // Two windows must never grow two different settings dialogs.
    if (window.BKSettings) window.BKSettings.init(document.getElementById('btnSettings'));
  </script>
</body>
</html>
