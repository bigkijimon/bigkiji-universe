name: Production readiness

on:
  push:
  pull_request:

permissions:
  contents: read

# Group runs per ref, but do not cancel one to start another. cancel-in-progress
# looked right and was not: a rerun counts as a new run on the same ref, so asking
# for the result cancelled the attempt that was producing it, and every job that had
# not finished yet was reported as "failure" with no failed step. On a project where
# the whole matrix takes a few minutes, letting runs finish costs less than not being
# able to trust what they say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Known issue #1: the POSIX runners are shut down from outside, mid-suite. What
      # the machine looked like when that happened has never been recorded, so OOM,
      # process count and disk have only been guessed at. Remove with the daemon-only
      # job below once #1 is answered.
      - name: machine state
        if: always() && runner.os != 'Windows'
        run: |
          echo "processes: $(ps -ef | wc -l)"
          ps -eo pid,ppid,rss,command | grep -i "[n]ode" || true
          df -h .
          ulimit -n
          if [ "$RUNNER_OS" = "Linux" ]; then free -m; else vm_stat; fi

  # Experiment for known issue #1. The kill always lands in test:daemon, but that test
  # is also always the 35th to run, so "the daemon test" and "half an hour of selftests
  # before it" have never been told apart. This is the same test with nothing in front
  # of it: if it dies here too, the daemon test is the culprit; if it does not, what
  # the earlier 34 leave behind is. Delete once #1 is answered.
  daemon-only:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: node processes before
        run: ps -eo pid,ppid,rss,command | grep -i "[n]ode" || true
      - run: npm run test:daemon
      # An orphan that outlives the test would be holding the job's stdio, which is the
      # thread known-issues #1 says to pull first. Either it is here or it is not.
      - name: node processes after
        if: always()
        run: ps -eo pid,ppid,rss,command | grep -i "[n]ode" || true
      - name: machine state
        if: always()
        run: |
          echo "processes: $(ps -ef | wc -l)"
          df -h .
          ulimit -n
          if [ "$RUNNER_OS" = "Linux" ]; then free -m; else vm_stat; fi

  electron-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Install scripts are gated in this project, so `npm ci` leaves electron/dist
      # empty and the binary is fetched on first launch. Fetch it explicitly, because
      # the next step needs the files to exist.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js
      # Chromium refuses to start rather than run unsandboxed, and its SUID helper
      # arrives owned by the unprivileged runner user. Giving it the ownership and
      # mode it asks for keeps the sandbox on, which is the point of the check —
      # passing --no-sandbox would make the smoke run prove less than it looks like.
      - name: Let Chromium's SUID sandbox helper do its job
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # A hosted runner has no GPU, so Three.js cannot get a WebGL context and the
      # canvas takes the app down with it. SwiftShader renders in software, which
      # keeps the smoke run testing what it says it tests — that the windows come up
      # — instead of skipping the part most likely to break.
      - run: xvfb-run -a env SMOKE=1 ./node_modules/.bin/electron . --use-gl=swiftshader --enable-unsafe-swiftshader
